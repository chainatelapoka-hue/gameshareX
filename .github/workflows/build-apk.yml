name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android SDK, platform and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.0.12077973"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/upload.jks"
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${SECRET_STORE_PASSWORD:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            STORE_PASS="$SECRET_STORE_PASSWORD"
            KEY_PASS="${SECRET_KEY_PASSWORD:-$SECRET_STORE_PASSWORD}"
            echo "Using the stable signing key from repo secrets."
          else
            STORE_PASS="$(openssl rand -hex 16)"
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -v -keystore "$KEYSTORE" -storetype PKCS12 -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=gameshareX, O=gameshareX, C=BD"
            echo "No signing secrets found. Created a temporary key for this build."
          fi
          echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Check for APIs newer than minSdk
        run: |
          set -uo pipefail
          gradle --no-daemon :app:lintRelease || true
          REPORT=app/build/reports/lint-results-release.xml
          if [ ! -f "$REPORT" ]; then echo "Lint report not found"; exit 1; fi
          if grep -q 'id="NewApi"' "$REPORT"; then
            grep -B2 -A3 'id="NewApi"' "$REPORT" | head -80
            echo "::error::Code uses APIs newer than minSdk 24"
            exit 1
          fi
          echo "No NewApi problems found."

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Name the APK
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk gameshareX.apk
          ls -lh gameshareX.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gameshareX-apk
          path: gameshareX.apk

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" gameshareX.apk \
            --title "gameshareX $TAG" \
            --notes "Built from commit ${GITHUB_SHA::7}. Latest APK: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/gameshareX.apk" \
            --latest
